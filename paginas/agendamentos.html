<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja Tatuagem - Agendamentos</title>
  </head>
  <body>
    <h1>Agendamentos</h1>
    <p><a href="/principal">Voltar</a></p>

    <table border="1">
      <tr>
        <th>Data do Agendamento</th>
        <th>Projeto</th>
        <th>Cliente</th>
        <th></th>
      </tr>
      {{#agendamentos}}
      <tr>
        <td>{{data_br}}</td>
        <td>{{regiao}} - {{estilo}}</td>
        <td>{{cliente_nome}}</td>
        <td>
          <a href="/agendamentos?editar={{id}}">Editar</a>
          <form method="POST" action="/agendamentos/{{id}}">
            <input type="hidden" name="_method" value="DELETE" />
            <button>Excluir</button>
          </form>
        </td>
      </tr>
      {{/agendamentos}}
    </table>

    <h2>
      {{#editando}} Editar {{/editando}}{{^editando}} Cadastrar {{/editando}}
      agendamento
    </h2>
    <form method="POST" action="{{acao}}">
      {{#editando}}<input type="hidden" name="_method" value="PUT" />
      {{/editando}}

      <select name="projetos_id" required>
        <option value="">Selecione o projeto...</option>
        {{#projetos}}
        <option value="{{id}}" {{selecionado}}>{{cliente_nome}} - {{regiao}} - {{estilo}}</option>
        {{/projetos}}
      </select>

      <input
        type="datetime-local"
        name="data_agendamento"
        value="{{form.data_input}}"
        required
      />

      <button>
        {{#editando}} Salvar {{/editando}}{{^editando}} Cadastrar {{/editando}}
      </button>
    </form>
    <p>{{erro}}</p>
  </body>
</html>
